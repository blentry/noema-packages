name: Verify Package Sources
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: sources
      - name: Read fixed verifier revision
        id: tool
        run: |
          python3 - <<'PY'
          import json, os, re
          revision = json.load(open('sources/noema-tool.json'))['commit']
          assert re.fullmatch('[0-9a-f]{40}', revision)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('commit=' + revision + '\n')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: blentry/noema
          ref: ${{ steps.tool.outputs.commit }}
          path: verifier
      - name: Build and prepare verifier
        working-directory: verifier
        run: |
          cargo build --package noema --locked
          target/debug/noema tools prepare
      - name: Verify immutable package contents and examples
        run: python3 verifier/scripts/distribution.py verify-source --packages sources --noema verifier/target/debug/noema --cache "$HOME/.cache/noema"
